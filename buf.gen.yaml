version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/destunna/gogrpccrud/pkg
  disable:
    - module: buf.build/bufbuild/protovalidate
plugins:
  - local: protoc-gen-go
    out: pkg
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: pkg
    opt:
      - paths=source_relative
inputs: 
  - directory: protobuf